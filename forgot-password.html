<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - CraftKart</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login-container">

    <div class="login-box">

        <h2>Forgot Password 🔐</h2>

        <p>Enter <b>CraftKart</b> to continue</p>

        <input
            type="text"
            id="secretWord"
            placeholder="Enter CraftKart">

        <button type="button" onclick="verifyWord()">
            Continue
        </button>

        <p id="message"></p>

        <p>
            <a href="login.html">Back to Login</a>
        </p>

    </div>

</div>

<script>

function verifyWord() {

    const word =
        document.getElementById("secretWord").value.trim();

    const message =
        document.getElementById("message");

    if (word.toLowerCase() === "craftkart") {

        localStorage.setItem("loggedIn", "true");

        message.textContent =
            "Verified! Opening CraftKart...";

        message.style.color = "green";

        setTimeout(function () {
            window.location.href = "index.html";
        }, 500);

    } else {

        message.textContent =
            "Please enter CraftKart.";

        message.style.color = "red";
    }
}

</script>

</body>
</html>
