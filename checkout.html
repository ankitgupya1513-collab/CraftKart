<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CraftKart - Checkout</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
        }

        header {
            background: #ff4081;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .checkout-container {
            width: 90%;
            max-width: 700px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
            color: #ff4081;
            margin-bottom: 25px;
        }

        .product-info {
            background: #fff0f5;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            text-align: center;
        }

        .product-info h3 {
            margin-bottom: 10px;
        }

        .product-info p {
            font-size: 20px;
            color: #ff4081;
            font-weight: bold;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        textarea {
            height: 100px;
            resize: none;
        }

        .place-order {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background: #ff4081;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
        }

        .place-order:hover {
            background: #e91e63;
        }

        .back-btn {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #ff4081;
            text-decoration: none;
        }
    </style>
</head>

<body>

<header>
    <h1>CraftKart 🛍️</h1>
</header>

<div class="checkout-container">

    <h2>Checkout</h2>

    <div class="product-info">

    <div id="checkoutProducts"></div>

    <hr>

    <h3>Total Amount</h3>

    <p id="checkoutTotal">₹0</p>

</div>

    <form id="checkoutForm">

        <label>Full Name</label>
        <input type="text" id="name" placeholder="Enter your name" required>

        <label>Mobile Number</label>
        <input type="tel" id="mobile" placeholder="Enter mobile number" required>

        <label>Address</label>
        <textarea id="address" placeholder="Enter your full address" required></textarea>

        <label>City</label>
        <input type="text" id="city" placeholder="Enter your city" required>

        <label>Payment Method</label>
        <select id="payment" required>
            <option value="">Select Payment Method</option>
            <option value="Cash on Delivery">Cash on Delivery</option>
            <option value="UPI">UPI</option>
        </select>

        <button type="submit" class="place-order">
            Place Order
        </button>

    </form>

    <a href="index.html" class="back-btn">
        ← Continue Shopping
    </a>

</div>

<script>

let checkoutCart =
    JSON.parse(localStorage.getItem("checkoutCart")) || [];

let total = 0;

const checkoutProducts =
    document.getElementById("checkoutProducts");


checkoutCart.forEach(function(item) {

    let price = Number(
        String(item.price)
        .replace("₹", "")
        .replace(",", "")
    );

    let quantity = Number(item.quantity) || 1;

    let itemTotal = price * quantity;

    total += itemTotal;


    checkoutProducts.innerHTML += `

        <div style="
            display:flex;
            align-items:center;
            gap:15px;
            padding:15px;
            margin-bottom:10px;
            background:white;
            border-radius:8px;
        ">

            <img
                src="${item.image}"
                alt="${item.name}"
                style="
                    width:100px;
                    height:100px;
                    object-fit:cover;
                    border-radius:8px;
                "
            >

            <div>

                <h3>${item.name}</h3>

                <p>Price: ₹${price}</p>

                <p>Quantity: ${quantity}</p>

                <p>
                    Item Total: ₹${itemTotal}
                </p>

            </div>

        </div>

    `;
});


document.getElementById("checkoutTotal").textContent =
    "₹" + total;


// ==============================
// PLACE ORDER
// ==============================

document.getElementById("checkoutForm")
.addEventListener("submit", function(event) {

    event.preventDefault();


    const name =
        document.getElementById("name").value;

    const mobile =
        document.getElementById("mobile").value;

    const address =
        document.getElementById("address").value;

    const city =
        document.getElementById("city").value;

    const payment =
        document.getElementById("payment").value;


    alert(
        "Order Placed Successfully! 🎉\n\n" +

        "Total Amount: ₹" + total +

        "\nName: " + name +

        "\nMobile: " + mobile +

        "\nCity: " + city +

        "\nPayment: " + payment
    );


    // Cart clear after order

    localStorage.removeItem("craftkartCart");

    localStorage.removeItem("checkoutCart");


    window.location.href = "index.html";

});

</script>
</body>
</html>
